openapi: 3.0.3
info:
  title: ChessStation API
  version: 1.0.0
  description: |
    Учебный REST API шахматных партий. Редакция контракта 007.
    PGN является источником истины; метаданные извлекаются сервером из его заголовков.
    Авторизации нет. Неизвестный маршрут API возвращает 404 с кодом NOT_FOUND.
    Полный перечень кодов ошибок: VALIDATION_ERROR, GAME_NOT_FOUND, NOT_FOUND,
    PAYLOAD_TOO_LARGE, TOO_MANY_REQUESTS, INTERNAL_ERROR.
    message и details[].message на русском языке; details[].field — английский идентификатор поля.
    Внешние ошибки прокси (например, 502/503/504) могут не иметь JSON-тела.
servers:
  - url: /chess-station/api/v1
    description: Публичный API
paths:
  /games:
    get:
      summary: Получить список партий
      description: |
        Возвращает метаданные без PGN, сортировка createdAt DESC, id DESC.
        total — число всех записей, соответствующих фильтру, до пагинации.
        Пустая база, отсутствие совпадений и страница за пределами списка дают 200 с пустым items.
        Некорректные page и limit (включая пустые, дробные и выходящие за диапазон значения)
        не исправляются автоматически и дают 400. Значения по умолчанию применяются только при отсутствии параметров.
      parameters:
        - name: player
          in: query
          description: |
            Регистронезависимый поиск буквальной подстроки в white или black (латиница и кириллица).
            Значение очищается через trim; пустое считается отсутствующим.
            Символы %, _ и обратная косая черта ищутся буквально. NUL и непарные суррогаты недопустимы.
          allowEmptyValue: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Список партий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Создать партию
      description: Сохраняет PGN без изменений и извлекает метаданные. Одинаковые PGN могут храниться как отдельные партии.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameInput'
      responses:
        '201':
          description: Партия создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /games/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Положительное целое число в диапазоне integer PostgreSQL. Некорректное значение даёт 400, отсутствующая партия с корректным id — 404.
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
    get:
      summary: Получить партию
      responses:
        '200':
          description: Полная партия с исходным PGN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/GameNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      summary: Заменить PGN партии
      description: |
        Полностью заменяет PGN и заново извлекает метаданные. Не создаёт отсутствующую партию.
        createdAt не меняется; updatedAt обновляется только при фактическом изменении PGN.
        Последняя успешная запись заменяет предыдущую.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameInput'
      responses:
        '200':
          description: Полная сохранённая партия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/GameNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Удалить партию
      responses:
        '204':
          description: Партия удалена, тело отсутствует
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/GameNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    GameInput:
      type: object
      required: [pgn]
      additionalProperties: false
      properties:
        pgn:
          type: string
          minLength: 1
          description: |
            Непустой, не только пробельный PGN. Сохраняется без изменения.
            Начальный BOM, NUL и непарные суррогаты Unicode запрещены.
            Сервер проверяет начальный блок заголовков, имена из латинских букв (регистр значим),
            отсутствие повторяющихся имён, непустые значения без двойных кавычек,
            обратной косой черты и управляющих символов. Пустая строка между заголовками
            и ходами не обязательна. Присутствующие Date и Result должны отвечать формату ниже.
            Превышение установленных лимитов PGN (байты UTF-8) или длины имён/события даёт 400.
            Конкретные лимиты выбираются при реализации, фиксируются в документации и контракте
            без изменения структуры API. Превышение предела HTTP-тела даёт 413.
            Сервер не проверяет легальность ходов, число партий, варианты, аннотации,
            нестандартную начальную позицию или совпадение Result с маркером ходов.
    GameSummary:
      type: object
      required: [id, white, black, event, date, result, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        white:
          type: string
          description: Из тега White; при отсутствии — '?'.
        black:
          type: string
          description: Из тега Black; при отсутствии — '?'.
        event:
          type: string
          description: Из тега Event; при отсутствии — '?'.
        date:
          type: string
          pattern: '^(?:[0-9]{4}|\?{4})\.(?:[0-9]{2}|\?{2})\.(?:[0-9]{2}|\?{2})$'
          description: Из тега Date, текстовая дата PGN (не ISO); при отсутствии — '????.??.??'. Проверяется формат, не календарная корректность.
        result:
          type: string
          enum: ['1-0', '0-1', '1/2-1/2', '*']
          description: Из тега Result; при отсутствии — '*'.
        createdAt:
          type: string
          format: date-time
          description: Время создания в UTC с суффиксом Z.
        updatedAt:
          type: string
          format: date-time
          description: Время последнего изменения PGN в UTC с суффиксом Z. При создании равно createdAt.
    Game:
      type: object
      required: [id, pgn, white, black, event, date, result, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        pgn:
          type: string
          description: Исходная сохранённая строка PGN без изменений.
        white:
          type: string
        black:
          type: string
        event:
          type: string
        date:
          type: string
          pattern: '^(?:[0-9]{4}|\?{4})\.(?:[0-9]{2}|\?{2})\.(?:[0-9]{2}|\?{2})$'
        result:
          type: string
          enum: ['1-0', '0-1', '1/2-1/2', '*']
        createdAt:
          type: string
          format: date-time
          description: UTC с суффиксом Z.
        updatedAt:
          type: string
          format: date-time
          description: UTC с суффиксом Z.
    GameList:
      type: object
      required: [items, total, page, limit]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GameSummary'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        limit:
          type: integer
          minimum: 1
          maximum: 100
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, GAME_NOT_FOUND, NOT_FOUND, PAYLOAD_TOO_LARGE, TOO_MANY_REQUESTS, INTERNAL_ERROR]
        message:
          type: string
        details:
          type: array
          items:
            type: object
            required: [field, message]
            additionalProperties: false
            properties:
              field:
                type: string
              message:
                type: string
  responses:
    BadRequest:
      description: |
        VALIDATION_ERROR. Некорректные параметры, невалидный JSON, пустое тело,
        неверный тип тела или pgn, отсутствующее pgn, лишние поля или нарушенные правила PGN.
        При наличии лишних полей details содержит отдельный элемент с именем каждого такого поля.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GameNotFound:
      description: GAME_NOT_FOUND — партия с корректным id отсутствует.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE — превышен допустимый размер HTTP-тела.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: TOO_MANY_REQUESTS — превышена допустимая частота запросов.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: INTERNAL_ERROR — внутренняя ошибка без раскрытия технических подробностей.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
